<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF Stanoviště 3</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f172a;color:white;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:700px;background:#1e293b;border-radius:20px;padding:25px;box-shadow:0 0 30px rgba(0,0,0,.4)}
h1{text-align:center;color:#22c55e;margin-top:0}.subtitle{text-align:center;color:#cbd5e1;margin-bottom:25px}
.pdf{display:block;width:100%;height:70vh;min-height:500px;border:0;border-radius:15px;margin-bottom:20px;background:white}
input{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;margin-bottom:15px}button{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;background:#22c55e;color:white;font-weight:bold;cursor:pointer}button:hover{background:#16a34a}.message{text-align:center;margin-top:15px;font-size:18px}.success{color:#4ade80}.error{color:#f87171}
</style>
</head>
<body>
<div class="card">
<h1>Stanoviště 3</h1>
<p class="subtitle">Najdi správný kód v PDF dokumentu.</p>
<iframe class="pdf" src="sifra2.pdf" title="Šifra 2"></iframe>
<input id="kod" placeholder="Zadej kód">
<button onclick="overit()">Pokračovat</button>
<div id="vysledek" class="message"></div>
</div>
<script>
const SPRAVNY_KOD = "KOMPAS";
const DALSI_ODKAZ = "https://mapy.cz";
function overit(){const zadan=document.getElementById("kod").value.trim();const vysledek=document.getElementById("vysledek");if(zadan.toUpperCase()===SPRAVNY_KOD){vysledek.className="message success";vysledek.innerHTML=`✅ Správně!<br><br><a href="${DALSI_ODKAZ}" target="_blank">Pokračovat na další stanoviště</a>`}else{vysledek.className="message error";vysledek.innerHTML="❌ Špatný kód"}}
</script>
</body>
</html>
