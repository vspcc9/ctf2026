<h1>Stanoviště 2</h1>

<input id="kod" placeholder="Zadej kód">
<button onclick="overit()">Odeslat</button>

<script>
function overit() {

    let kod = document.getElementById("kod").value;

    if(kod === "JAVOR123") {

        window.location.href =
        "https://maps.google.com/?q=49.1951,16.6068";

    }
    else {

        alert("Špatný kód");

    }
}
</script>
