<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvíz: Co na sebe prozradili NM</title>
<style>
:root{--navy:#10233f;--blue:#1677c8;--light:#eef6fc;--green:#18794e;--red:#b42318;--text:#192230}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf6fc,#f7f9fc);color:var(--text)}
header{background:var(--navy);color:white;padding:38px 20px;text-align:center} header h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.5rem)} header p{margin:0;color:#d9eafb}
main{max-width:900px;margin:28px auto;padding:0 16px 48px} .top{display:flex;gap:12px;align-items:center;margin-bottom:18px} progress{width:100%;height:14px;accent-color:var(--blue)}
.card{background:#fff;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 35px #183b5d1c} .counter{color:#526172;font-weight:700} h2{font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.3}
.answers{display:grid;gap:12px;margin:24px 0} .answer{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid #d9e3ec;background:white;border-radius:12px;padding:15px;font-size:1rem;cursor:pointer}
.answer:hover,.answer:focus-visible{border-color:var(--blue);background:var(--light);outline:none} .answer.selected{border-color:var(--blue);background:var(--light)} .letter{font-weight:800;color:var(--blue)}
.actions{display:flex;justify-content:flex-end;gap:10px} button.primary{border:0;background:var(--blue);color:white;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer} button.primary:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center} .score{font-size:clamp(2.6rem,8vw,5rem);font-weight:850;color:var(--navy);margin:8px} .review{text-align:left;margin-top:28px;display:grid;gap:12px} .item{padding:14px;border-left:5px solid;border-radius:8px;background:#f7f9fb} .ok{border-color:var(--green)} .bad{border-color:var(--red)} .small{color:#526172;font-size:.92rem} footer{text-align:center;color:#637181;padding:20px}
@media(max-width:520px){header{padding:28px 14px}.card{border-radius:13px}}
</style></head><body>
<header><h1>Kvíz: Co na sebe prozradili NM</h1><p>Vyberte u každé otázky jednu odpověď a zjistěte své skóre.</p></header>
<main><div id="quiz"><div class="top"><progress id="progress" max="12" value="1"></progress><span id="progressText">1/12</span></div><section class="card"><div class="counter" id="counter"></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="actions"><button class="primary" id="next" disabled>Další otázka</button></div></section></div><section class="card result" id="result" hidden></section></main>
<footer>Interní kvíz NM</footer>
<script>
const questions=[{"q": "Město narození TK", "a": ["Třebíč", "Třeboň", "Tišnov"], "correct": 0}, {"q": "Z kolika sourozenců pochází TK", "a": ["Z dvojčat", "Z trojčat", "Ze tří"], "correct": 1}, {"q": "Jakému sportu se TK dlouhodobě v „mládí“ věnoval", "a": ["Házené", "Volejbalu", "Národní házené"], "correct": 0}, {"q": "TK nastoupil na NÚKIB", "a": ["V roce, kdy Miloš Zeman udělil doživotně odsouzenému Jiřímu Kajínkovi kontroverzní milost.", "V roce, kdy si obyvatelé Spojeného království v červnovém referendu odhlasovali odchod své země z Evropské unie (tzv. Brexit).", "V roce, kdy v Praze a Ostravě proběhlo mistrovství světa v ledním hokeji."], "correct": 1}, {"q": "Oblíbeným zpěvákem/skupinou TK je", "a": ["Britská skupina, kterou založil v roce 1977 Mark Knopfler.", "Autor písně, v níž vystupuje Angličan v New Yorku a zmiňuje čaj místo kávy.", "Autor písně „Born to Run“."], "correct": 2}, {"q": "Na jaký hudební nástroj / nástroje umí hrát TK", "a": ["Klavír, ukulele", "Klavír, bicí", "Klavír, kytara"], "correct": 2}, {"q": "MU se narodila ve stejném městě jako", "a": ["Milan Kundera", "Sigmund Freud", "Gabriela Soukalová"], "correct": 1}, {"q": "Jakému sportu se MU dlouhodobě v „mládí“ věnovala", "a": ["Baletu", "Latinskoamerickým tancům", "Mažoretkovému sportu"], "correct": 2}, {"q": "V jakém oddělení MU nikdy nepůsobila", "a": ["OMS", "NASTAPO", "OC"], "correct": 0}, {"q": "Co bývala oblíbená teambuildingová aktivita MU v době, kdy na NCKB fungovaly CERT a OKBP", "a": ["Spartan Race", "Triatlon", "Půlmaraton"], "correct": 0}, {"q": "Ve volném čase se MU ráda věnuje", "a": ["Pěstování kytek", "Jízdě na horském kole po singletrailu", "Běhání"], "correct": 1}, {"q": "MU nastoupila v roce 2014 spolu s", "a": ["Petrem Novotným", "Václavem Borovičkou", "Danielem P. Bagge"], "correct": 1}]; let index=0; const picks=[];
const qEl=document.querySelector('#question'), aEl=document.querySelector('#answers'), next=document.querySelector('#next');
function render(){const q=questions[index]; document.querySelector('#counter').textContent=`Otázka ${index+1} z ${questions.length}`;qEl.textContent=q.q;aEl.innerHTML='';document.querySelector('#progress').value=index+1;document.querySelector('#progressText').textContent=`${index+1}/${questions.length}`;q.a.forEach((text,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${'ABC'[i]}</span><span></span>`;b.lastChild.textContent=text;b.onclick=()=>{[...aEl.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');picks[index]=i;next.disabled=false};aEl.appendChild(b)});next.disabled=picks[index]===undefined;next.textContent=index===questions.length-1?'Vyhodnotit':'Další otázka'}
next.onclick=()=>{if(index<questions.length-1){index++;render()}else showResult()};
function showResult(){document.querySelector('#quiz').hidden=true;let score=questions.reduce((s,q,i)=>s+(picks[i]===q.correct),0);const r=document.querySelector('#result');r.hidden=false;const pct=Math.round(score/questions.length*100);let msg=score<=5?'Smolík! Nemáš ani polovinu, tak to zkus znova! :)':'Gratulace';r.innerHTML=`<h2>${msg}</h2><div class="score">${score} / ${questions.length}</div><p>${pct} % správných odpovědí</p><button class="primary" onclick="location.reload()">Spustit znovu</button><div class="review"><h3>Přehled odpovědí</h3>${questions.map((q,i)=>`<div class="item ${picks[i]===q.correct?'ok':'bad'}"><strong>${i+1}. ${q.q}</strong><div class="small">Vaše odpověď: ${q.a[picks[i]]}</div>${picks[i]!==q.correct?`<div class="small">Správně: ${q.a[q.correct]}</div>`:''}</div>`).join('')}</div>`;window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
