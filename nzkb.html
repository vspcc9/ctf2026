<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: NÚKIB a zákon o kybernetické bezpečnosti</title><style>
:root{--navy:#10233f;--blue:#1677c8;--light:#eef6fc;--green:#18794e;--red:#b42318;--text:#192230}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf6fc,#f7f9fc);color:var(--text)}header{background:var(--navy);color:#fff;padding:38px 20px;text-align:center}header h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.5rem)}header p{margin:0;color:#d9eafb}main{max-width:900px;margin:28px auto;padding:0 16px 48px}.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}progress{width:100%;height:14px;accent-color:var(--blue)}.card{background:#fff;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 35px #183b5d1c}.counter{color:#526172;font-weight:700}h2{font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.3}.answers{display:grid;gap:12px;margin:24px 0}.answer{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid #d9e3ec;background:#fff;border-radius:12px;padding:15px;font-size:1rem;cursor:pointer}.answer:hover,.answer:focus-visible{border-color:var(--blue);background:var(--light);outline:none}.answer.selected{border-color:var(--blue);background:var(--light)}.letter{font-weight:800;color:var(--blue)}.actions{display:flex;justify-content:flex-end}.primary,.map-link{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.primary:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:clamp(2.6rem,8vw,5rem);font-weight:850;color:var(--navy);margin:8px}.message{font-size:1.2rem;font-weight:700;line-height:1.5}.review{text-align:left;margin-top:28px;display:grid;gap:12px}.item{padding:14px;border-left:5px solid;border-radius:8px;background:#f7f9fb}.ok{border-color:var(--green)}.bad{border-color:var(--red)}.small{color:#526172;font-size:.92rem;margin-top:4px}footer{text-align:center;color:#637181;padding:20px}@media(max-width:520px){header{padding:28px 14px}.card{border-radius:13px}}
</style></head><body><header><h1>Kvíz: NÚKIB a zákon o kybernetické bezpečnosti</h1><p>Vyberte u každé otázky jednu odpověď a zjistěte své skóre.</p></header><main><div id="quiz"><div class="top"><progress id="progress" max="15" value="1"></progress><span id="progressText">1/15</span></div><section class="card"><div class="counter" id="counter"></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="actions"><button class="primary" id="next" disabled>Další otázka</button></div></section></div><section class="card result" id="result" hidden></section></main><footer>Interní kvíz NÚKIB</footer><script>
const questions=[{"q": "Organizace zjistí, že splnila podmínky pro registraci regulované služby podle nového ZKB. Do kdy musí NÚKIBu ohlásit naplnění těchto podmínek?", "a": ["Nejpozději do 60 dnů od účinnosti zákona", "Nejpozději do 60 dnů od splnění podmínek", "Nejpozději do 60 dnů od doručení výzvy NÚKIB"], "correct": 1}, {"q": "Která charakteristika nejpřesněji vystihuje hlavní rozdíl mezi režimem vyšších a nižších povinností podle nového ZKB?", "a": ["Vyšší režim ukládá širší rozsah bezpečnostních opatření, zatímco nižší režim má jejich rozsah omezenější", "Vyšší režim se týká pouze státních orgánů, nižší režim pouze soukromých podniků", "Vyšší režim se týká pouze soukromých podniků, nižší režim pouze státních orgánů"], "correct": 0}, {"q": "Poskytovatel regulované služby změní údaj, který je referenčním údajem vedeným v základních registrech. Jaká je obecná lhůta pro oznámení této změny NÚKIB?", "a": ["14 dnů", "15 dnů", "Tyto změny se neoznamují"], "correct": 2}, {"q": "Poskytovatel regulované služby ve vyšším režimu zjistí kybernetický bezpečnostní incident. Kdy musí podat prvotní hlášení?", "a": ["Do 24 hodin od okamžiku, kdy incident nastal", "Do 24 hodin od ukončení incidentu", "Do 24 hodin od zjištění incidentu"], "correct": 2}, {"q": "Která situace odpovídá pravidlům pro hlášení incidentů ve vyšším režimu?", "a": ["Hlásí se všechny kybernetické bezpečnostní incidenty, které se projevily ve stanoveném rozsahu, mají původ v kybernetickém prostoru a nelze u nich vyloučit úmyslné zavinění", "Hlásí se všechny kybernetické bezpečnostní incidenty, které se projevily ve stanoveném rozsahu, mají původ v kybernetickém prostoru, mají významný dopad na poskytování regulované služby a nelze u nich vyloučit úmyslné zavinění", "Hlásí se všechny kybernetické bezpečnostní incidenty, které se projevily ve stanoveném rozsahu, mají původ v kybernetickém prostoru a lze u nich vyloučit úmyslné zavinění"], "correct": 0}, {"q": "Co se podle aktuálních informací NÚKIB stalo hlavním komunikačním nástrojem mezi regulovanými subjekty a NÚKIB při standardizovaných úkonech podle nového ZKB?", "a": ["Informační systém datových schránek", "IS4NIS", "Portál NÚKIB"], "correct": 2}, {"q": "Regulovaný subjekt nemůže kvůli výpadku použít zákonem stanovený informační systém k nahlášení kybernetického bezpečnostního incidentu. Jaký princip platí?", "a": ["Kybernetický bezpečnostní incident nehlásí, dokud není chod systému obnoven", "Musí využít náhradní způsob hlášení stanovený zákonem", "Kybernetický bezpečnostní incident musí ohlásit Národnímu CERT"], "correct": 1}, {"q": "Která z následujících povinností patří mezi hlavní povinnosti poskytovatele regulované služby ve vyšším režimu?", "a": ["Hlášení kybernetických bezpečnostních incidentů bez zavádění dalších opatření", "Zavedení stanovených bezpečnostních opatření", "Zavedení systému řízení bezpečnosti informací a provedení certifikace podle normy ISO/IEC 27001:2022 Information Security Management System (ISMS)"], "correct": 1}, {"q": "U významného kybernetického bezpečnostního incidentu, který byl prvotně oznámen, musí být doplněna navazující zpráva nejpozději:", "a": ["Do 72 hodin od prvotního hlášení", "Do 24 hodin od prvotního hlášení", "Do 72 hodin od zjištění incidentu"], "correct": 2}, {"q": "NÚKIB vydá rozhodnutí o reaktivním protiopatření, ale nepodaří se jej adresátovi doručit do vlastních rukou. Po jaké době může nastoupit náhradní způsob doručení prostřednictvím úřední desky NÚKIB?", "a": ["Po 24 hodinách", "Po 48 hodinách", "Po 72 hodinách"], "correct": 2}, {"q": "Které tvrzení nejpřesněji popisuje výstrahu podle § 21 ZKB?", "a": ["NÚKIB ji vydává, když zjistí zranitelnost, a adresuje ji regulovanému subjektu", "NÚKIB může po konzultaci s dotčeným poskytovatelem informovat veřejnost o incidentu nebo porušování povinností, případně uložit poskytovateli, aby tak učinil sám", "NÚKIB může poskytovateli regulované služby, který je dotčen kybernetickým bezpečnostním incidentem s významným dopadem, uložit povinnost nebo zákaz informovat uživatele regulované služby o tomto incidentu"], "correct": 1}, {"q": "Které tvrzení o třech typech protiopatření podle nového ZKB je správné?", "a": ["Výstraha, varování a reaktivní protiopatření jsou tři zákonem definované typy protiopatření", "Varování, nápravné opatření a reaktivní protiopatření jsou tři zákonem definované typy protiopatření", "Varování, reaktivní protiopatření a kontrola jsou tři zákonem definované typy protiopatření"], "correct": 0}, {"q": "Poskytovatel regulované služby ve vyšším režimu obdrží od NÚKIB reaktivní protiopatření. Pokud NÚKIB nestanoví jinak, co musí poskytovatel následně udělat?", "a": ["Potvrdit přijetí rozhodnutí", "Oznámit NÚKIB jeho provedení a výsledek", "Předložit výsledek interního auditu potvrzující jeho provedení"], "correct": 1}, {"q": "Co je primárním účelem kontroly prováděné NÚKIB podle § 55 ZKB?", "a": ["Zjistit, zda poskytovatel dosahuje úrovně bezpečnosti podle normy ISO/IEC 27001:2022 Information Security Management System (ISMS)", "Zjistit, jak jsou plněny povinnosti stanovené zákonem, na jeho základě a přímo použitelnými předpisy EU v oblasti kybernetické bezpečnosti", "Zjistit, zda poskytovatel používá výhradně technologie schválené NÚKIB"], "correct": 1}, {"q": "NÚKIB při kontrole zjistí, že regulovaný subjekt neplní povinnost stanovenou ZKB. Co může Úřad podle § 56 uložit?", "a": ["Nápravné opatření, kterým uloží odstranění zjištěných nedostatků ve stanovené lhůtě, případně určí způsob jejich odstranění", "Pokutu, protože nápravná opatření může ukládat pouze soud", "Zákaz poskytování regulované služby po schválení soudem"], "correct": 0}],mapUrl="https://mapy.com/cs/turisticka?source=coor&id=15.31386449933052%2C49.64213736355305&x=15.3113276&y=49.6451085&z=16.5";let index=0;const picks=[];const qEl=document.querySelector('#question'),aEl=document.querySelector('#answers'),next=document.querySelector('#next');function render(){const q=questions[index];document.querySelector('#counter').textContent=`Otázka ${index+1} z ${questions.length}`;qEl.textContent=q.q;aEl.innerHTML='';document.querySelector('#progress').value=index+1;document.querySelector('#progressText').textContent=`${index+1}/${questions.length}`;q.a.forEach((text,i)=>{const b=document.createElement('button');b.className='answer';const l=document.createElement('span');l.className='letter';l.textContent='ABC'[i];const t=document.createElement('span');t.textContent=text;b.append(l,t);b.onclick=()=>{[...aEl.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');picks[index]=i;next.disabled=false};aEl.appendChild(b)});next.disabled=picks[index]===undefined;next.textContent=index===questions.length-1?'Vyhodnotit':'Další otázka'}next.onclick=()=>{if(index<questions.length-1){index++;render()}else showResult()};function showResult(){document.querySelector('#quiz').hidden=true;const score=questions.reduce((s,q,i)=>s+(picks[i]===q.correct),0),pct=Math.round(score/questions.length*100),r=document.querySelector('#result');r.hidden=false;const message=score<=7?'Smolík! Nemáš ani polovinu, tak to zkus znova :)':'Gratulace! Pokračuj na další stanoviště:';const mapButton=score>=8?`<p><a class="map-link" href="${mapUrl}" target="_blank" rel="noopener noreferrer">Otevřít mapu dalšího stanoviště</a></p>`:'';r.innerHTML=`<h2>Výsledek</h2><div class="score">${score} / ${questions.length}</div><p>${pct} % správných odpovědí</p><p class="message">${message}</p>${mapButton}<button class="primary" onclick="location.reload()">Spustit znovu</button><div class="review"><h3>Přehled odpovědí</h3>${questions.map((q,i)=>`<div class="item ${picks[i]===q.correct?'ok':'bad'}"><strong>${i+1}. ${q.q}</strong><div class="small">Vaše odpověď: ${q.a[picks[i]]}</div>${picks[i]!==q.correct?`<div class="small">Správně: ${q.a[q.correct]}</div>`:''}</div>`).join('')}</div>`;window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
