<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: NÚKIB a co bychom měli vědět</title><style>
:root{--navy:#10233f;--blue:#1677c8;--light:#eef6fc;--green:#18794e;--red:#b42318;--text:#192230}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf6fc,#f7f9fc);color:var(--text)}header{background:var(--navy);color:#fff;padding:38px 20px;text-align:center}header h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.5rem)}header p{margin:0;color:#d9eafb}main{max-width:900px;margin:28px auto;padding:0 16px 48px}.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}progress{width:100%;height:14px;accent-color:var(--blue)}.card{background:#fff;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 35px #183b5d1c}.counter{color:#526172;font-weight:700}h2{font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.3}.answers{display:grid;gap:12px;margin:24px 0}.answer{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid #d9e3ec;background:#fff;border-radius:12px;padding:15px;font-size:1rem;cursor:pointer}.answer:hover,.answer:focus-visible{border-color:var(--blue);background:var(--light);outline:none}.answer.selected{border-color:var(--blue);background:var(--light)}.letter{font-weight:800;color:var(--blue)}.actions{display:flex;justify-content:flex-end}button.primary,.map-link{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button.primary:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center}.score{font-size:clamp(2.6rem,8vw,5rem);font-weight:850;color:var(--navy);margin:8px}.message{font-size:1.2rem;font-weight:700;line-height:1.5}.review{text-align:left;margin-top:28px;display:grid;gap:12px}.item{padding:14px;border-left:5px solid;border-radius:8px;background:#f7f9fb}.ok{border-color:var(--green)}.bad{border-color:var(--red)}.small{color:#526172;font-size:.92rem;margin-top:4px}footer{text-align:center;color:#637181;padding:20px}@media(max-width:520px){header{padding:28px 14px}.card{border-radius:13px}}
</style></head><body><header><h1>Kvíz: NÚKIB a co bychom měli vědět</h1><p>Vyberte u každé otázky jednu odpověď a zjistěte své skóre.</p></header><main><div id="quiz"><div class="top"><progress id="progress" max="12" value="1"></progress><span id="progressText">1/12</span></div><section class="card"><div class="counter" id="counter"></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="actions"><button class="primary" id="next" disabled>Další otázka</button></div></section></div><section class="card result" id="result" hidden></section></main><footer>Interní kvíz NÚKIB</footer><script>
const questions=[{"q": "Jsem na konferenci a v ceně konference je poskytnutý oběd formou rautu. Ve zprávě ze služební cesty:", "a": ["Označím raut jako oběd, neboť se jedná o řádné hlavní servírované jídlo.", "Můžu, ale nemusím označit raut za řádné hlavní servírované jídlo. Záleží na mém posouzení podle velikosti porce.", "Neřeším a uvedu, že oběd mi poskytnutý nebyl."], "correct": 1}, {"q": "Chci absolvovat on-line vzdělávací kurz poskytovaný zahraniční společností. Co pro to musím udělat?", "a": ["Poslat Ditě Kiliánové mým vedoucím schválenou přihlášku na vzdělávací akci. Ona už vyřeší zbytek a v případě potřeby mě kontaktuje.", "Ověřit předem, zda mi poskytovatel vystaví fakturu na Úřad, a následně poslat Ditě Kiliánové mým vedoucím schválenou přihlášku na vzdělávací akci. Ona už vyřeší zbytek a v případě potřeby mě kontaktuje.", "Poslat Ditě Kiliánové mým vedoucím schválenou přihlášku na vzdělávací akci, ale na akci se přihlásit sám. Následně zažádám o proplacení uhrazené částky prostřednictvím oddělení účetnictví."], "correct": 1}, {"q": "Mám nahlášený a schválený půldenní HO.", "a": ["Moje pracovní doba může být maximálně 8 hodin v součtu, tudíž v práci zbytečně nevysedávám a po 4 hodinách odcházím. Jinak o takto nadpracované hodiny přijdu.", "Uplatní se stejný princip jako u půldenní dovolené, tedy můžu být v práci déle než čtyři hodiny a hodiny nad tento rozsah mi budou převedeny do plusového salda.", "Pokud jsem fyzicky v práci déle než 4 hodiny, hodiny nad tento rozsah mi budou v rámci docházky seškrtány, ale můžu si je evidovat bokem a následně je uplatnit podle podmínek kolektivní smlouvy."], "correct": 0}, {"q": "Zahraniční služební cestu:", "a": ["Vyúčtuji do 10 pracovních dní po dni ukončení pracovní cesty.", "Vyúčtuji do 10 dní po dni ukončení pracovní cesty.", "Vyúčtuji v rámci zprávy ze ZPC a podám jej písemně do 10 pracovních dní po dni ukončení pracovní cesty."], "correct": 0}, {"q": "Posledním oznámeným schváleným interním aktem je:", "a": ["Příprava a provedení inventarizace majetku České republiky v působnosti NÚKIB", "Statut Krizového štábu NÚKIB", "Přijímání zaměstnanců Národního úřadu pro kybernetickou a informační bezpečnost"], "correct": 2}, {"q": "Ultrarychlá nabíjecí stanice vhodná pro elektromobily NÚKIB cestou po D1 z Prahy do Brna se nachází na:", "a": ["96. km", "115. km", "84. km"], "correct": 0}, {"q": "Využiji služební byt pro soukromé účely:", "a": ["Za tuto možnost poděkuji na e-mail reditel@nukib.gov.cz.", "Vyluxuji po svém pejskovi, poklidím i po sobě, vynesu odpadky, svleču povlečení a varnou konvici postavím mimo podstavec.", "Uhradím minimálně 50 % výdajů na provoz bytu po dobu jeho využití."], "correct": 2}, {"q": "Soukromé volno si na docházkovém terminálu při odchodu odkliknu:", "a": ["Když odcházím v čase mezi 9–14 hod., pokud se už pak nevrátím do práce.", "Kdykoliv, pokud se už pak nevrátím do práce.", "Když odcházím v čase mezi 9–14 hod. a pak se ještě vrátím do práce, soukromé volno na terminálu neodkliknu, jedná se o mimořádné volno."], "correct": 0}, {"q": "Kdo zajišťuje víza na úřadě?", "a": ["Sekretariát OMSEU", "Sekretariát příslušného celku, jehož zaměstnanec o víza žádá", "Sekretariát NM SSAS"], "correct": 2}, {"q": "Z fondu sociálně kulturních potřeb lze čerpat prostředky na:", "a": ["Multisport kartu, dentální hygienu, dioptrické pomůcky a šalinkartu.", "Lístky do divadla, knihy včetně elektronických, Multisport kartu a produkt spoření na stáří.", "Dovolenou, zájmové kroužky dítěte a zrnkovou kávu do společných kávovarů."], "correct": 0}, {"q": "Vánoční večírek NCKB + SSAS se koná:", "a": ["17. 12. 2026 ve Trojce", "10. 12. 2026 v Mezzanine", "9. 12. 2026 v Alterně"], "correct": 1}, {"q": "Sdílené hodnoty NÚKIB jsou:", "a": ["Loajalita, Profesionalita, Důvěryhodnost, Týmová práce, Odvaha, Respekt", "Loajalita, Profesionalita, Bezpečnost, Důvěryhodnost, Týmová práce, Respekt", "Loajalita, Profesionalita, Důvěryhodnost, Týmová práce, Slušnost, Odvaha, Respekt"], "correct": 0}],mapUrl="https://mapy.com/cs/turisticka?source=coor&id=15.316719710826849%2C49.64608423411817&x=15.3113276&y=49.6451085&z=16.5";let index=0;const picks=[];const qEl=document.querySelector('#question'),aEl=document.querySelector('#answers'),next=document.querySelector('#next');function render(){const q=questions[index];document.querySelector('#counter').textContent=`Otázka ${index+1} z ${questions.length}`;qEl.textContent=q.q;aEl.innerHTML='';document.querySelector('#progress').value=index+1;document.querySelector('#progressText').textContent=`${index+1}/${questions.length}`;q.a.forEach((text,i)=>{const b=document.createElement('button');b.className='answer';const l=document.createElement('span');l.className='letter';l.textContent='ABC'[i];const t=document.createElement('span');t.textContent=text;b.append(l,t);b.onclick=()=>{[...aEl.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');picks[index]=i;next.disabled=false};aEl.appendChild(b)});next.disabled=picks[index]===undefined;next.textContent=index===questions.length-1?'Vyhodnotit':'Další otázka'}next.onclick=()=>{if(index<questions.length-1){index++;render()}else showResult()};function showResult(){document.querySelector('#quiz').hidden=true;const score=questions.reduce((s,q,i)=>s+(picks[i]===q.correct),0),pct=Math.round(score/questions.length*100),r=document.querySelector('#result');r.hidden=false;const message=score<=7?'Smolík! Nemáš ani polovinu, tak to zkus znova :)':'Gratulace! Pokračuj na další stanoviště:';const mapButton=score>=8?`<p><a class="map-link" href="${mapUrl}" target="_blank" rel="noopener noreferrer">Otevřít mapu dalšího stanoviště</a></p>`:'';r.innerHTML=`<h2>Výsledek</h2><div class="score">${score} / ${questions.length}</div><p>${pct} % správných odpovědí</p><p class="message">${message}</p>${mapButton}<button class="primary" onclick="location.reload()">Spustit znovu</button><div class="review"><h3>Přehled odpovědí</h3>${questions.map((q,i)=>`<div class="item ${picks[i]===q.correct?'ok':'bad'}"><strong>${i+1}. ${q.q}</strong><div class="small">Vaše odpověď: ${q.a[picks[i]]}</div>${picks[i]!==q.correct?`<div class="small">Správně: ${q.a[q.correct]}</div>`:''}</div>`).join('')}</div>`;window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
